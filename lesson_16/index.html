<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:regular,500,600,700,800,900"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Homework 16</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <div class="header__wrapper">
            <a href="#" class="logo">
              <img class="logo__img" src="img/logo.svg" alt="Education Pro" />
              <span class="logo__title">Education Pro</span>
            </a>
            <div class="menu">
              <div class="menu__body">
                <ul class="menu__list">
                  <li class="menu__item menu__item--current">
                    <a class="menu__link" href="#">About</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#">Services</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#">Quality Policy</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#">Languages</a>
                  </li>
                  <li class="menu__item">
                    <a class="menu__link" href="#">Contact</a>
                  </li>
                </ul>
              </div>
            </div>
            <div class="contacts">
              <button class="button">Get Quote</button>
              <button class="icon-menu">
                <span></span>
              </button>
            </div>
          </div>
        </div>
      </header>
      <main class="page">
        <div class="welcome-section">
          <img
            class="welcome-section__img"
            src="img/welcome/welcome-bg.avif"
            alt="Transforming words across borders"
          />
        </div>
      </main>
      <footer class="footer">
        <div class="footer__container">
          <ul class="footer__menu">
            <li class="footer__link">
              <a href="https://github.com/agb220" target="_blank">GitHub</a>
            </li>
          </ul>
          <p class="footer__copyright">
            Copyright © 2025 Anna Balabon. All Rights Reserved
          </p>
        </div>
      </footer>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
