<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:regular,500,600,700,800,900"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Carme:regular"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Homework 17</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <p class="header__logo">HEADER</p>
        </div>
      </header>
      <main class="page page-margin-top">
        <section class="practice practice--margin">
          <div class="practice__container">
            <h2 class="practice __title">Practice</h2>
            <div class="practice__block"></div>
          </div>
        </section>
        <section class="floral">
          <div class="floral__wrapper">
            <div class="floral__container">
              <div class="floral__block">
                <div class="floral__small">
                  <div class="floral__small-items">
                    <div class="floral__item">
                      <a href="#" class="floral__link">
                        <img src="img/floral/1.avif" alt="Enchanted Petals" />
                      </a>
                      <div class="floral__info">
                        <div class="floral__active-block">
                          <h4 class="floral__name">
                            <a href="#">Enchanted Petals</a>
                          </h4>
                          <div class="floral__active">
                            <img
                              class="floral__icon"
                              src="img/floral/icon/like.png"
                              alt="Wishlist icon"
                            />
                            <img
                              class="floral__icon"
                              src="img/floral/icon/cart.png"
                              alt="Shopping cart icon"
                            />
                          </div>
                        </div>
                        <div class="floral__price">70 <span>Euro</span></div>
                      </div>
                    </div>
                    <div class="floral__item">
                      <a href="#" class="floral__link">
                        <img src="img/floral/2.avif" alt="Enchanted Petals" />
                      </a>
                      <div class="floral__info">
                        <div class="floral__active-block">
                          <h4 class="floral__name">
                            <a href="#">Floral Harmony</a>
                          </h4>
                          <div class="floral__active">
                            <img
                              class="floral__icon"
                              src="img/floral/icon/like.png"
                              alt="Wishlist icon"
                            />
                            <img
                              class="floral__icon"
                              src="img/floral/icon/cart.png"
                              alt="Shopping cart icon"
                            />
                          </div>
                        </div>
                        <div class="floral__price">80 <span>Euro</span></div>
                      </div>
                    </div>
                  </div>
                  <a class="floral__button">
                    <div class="floral__button-wrapper">
                      <span>Open More</span>
                      <img
                        src="img/floral/icon/arrow.png"
                        alt="Open More arrow"
                      /></div
                  ></a>
                </div>
                <div class="floral__big">
                  <h2 class="floral__title">
                    Catalog of Floral Delights for Every Occasion
                  </h2>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <div class="footer__container">
          <ul class="footer__menu">
            <li class="footer__link">
              <a href="https://github.com/agb220" target="_blank">GitHub</a>
            </li>
          </ul>
          <p class="footer__copyright">
            Copyright © 2025 Anna Balabon. All Rights Reserved
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
