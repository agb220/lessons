<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:regular,500,600,700,800,900"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Carme:regular"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Homework 17</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <p class="header__logo">HEADER</p>
        </div>
      </header>
      <main class="page page-margin-top">
        <section class="practice practice--margin">
          <div class="practice__container">
            <h2 class="practice __title">Practice</h2>
            <div class="practice__block"></div>
          </div>
        </section>
        <section class="floral">
          <div class="floral__container">
            <div class="floral__wrapper">
              <div class="floral__blocks block">
                <div class="block__small items">
                  <div class="items__wrapper small-block">
                    <div class="item">
                      <a href="#" class="item__link">
                        <img src="img/floral/1.avif" alt="Enchanted Petals" />
                      </a>
                      <div class="item__info">
                        <div class="item__active">
                          <h4 class="item__name">
                            <a href="#">Enchanted Petals</a>
                          </h4>
                          <div class="item__icons">
                            <img
                              class="item__icon"
                              src="img/floral/icon/like.png"
                              alt="Wishlist icon"
                            />
                            <img
                              class="item__icon"
                              src="img/floral/icon/cart.png"
                              alt="Shopping cart icon"
                            />
                          </div>
                        </div>
                        <div class="item__price">70 <span>Euro</span></div>
                      </div>
                    </div>
                    <div class="item">
                      <a href="#" class="item__link">
                        <img src="img/floral/2.avif" alt="Floral Harmony" />

                        <div class="item__active">
                          <h4 class="item__name">

                              src="img/floral/icon/like.png"
                              alt="Wishlist icon"
                            />
                            <img
                              class="item__icon"
                              src="img/floral/icon/cart.png"
                              alt="Shopping cart icon"
                            />
                          </div>
                        </div>
                        <div class="item__price">80 <span>Euro</span></div>
                      </div>
                    </div>
                  </div>
                  <a class="button-floral">
                    <div class="button-floral__wrapper">
                      <span>Open More</span>
                      <img
                        src="img/floral/icon/arrow.png"
                        alt="Open More arrow"
                      /></div
                  ></a>
                </div>
                <div class="block__big items">
                  <div class="items__wrapper big-block">
                    <h2 class="items__title">
                      Catalog of Floral Delights for Every Occasion
                    </h2>
                    <div class="item">
                      <a href="#" class="item__link">
                        <img src="img/floral/3.avif" alt="Whispering Meadows" />

                        </div>

                    </div>

      <footer class="footer">
