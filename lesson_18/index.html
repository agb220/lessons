<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:regular,500,600,700,800,900"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Homework 18</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="header__container">
          <p class="header__logo">HEADER</p>
        </div>
      </header>
      <main class="page page-margin-top">
        <div class="page__container">
          <div class="page__wrapper">
            <div class="page__main-content article">
              <article>
                <div class="article__main-img">
                  <img
                    src="img/oranges.avif"
                    alt="Maecenas tempor urna sed quam mollis, a placerat dui fringill Suspendisse."
                  />
                </div>
                <div class="article__tags tags">
                  <ul class="tags__wrapper tag">
                    <li class="tag__item">
                      <div class="tag__icon">
                        <img src="img/icon/tag-1.svg" alt="Food" />
                      </div>
                      <div class="tag__title">Food</div>
                    </li>
                    <li class="tag__item">
                      <div class="tag__icon">
                        <img src="img/icon/tag-2.svg" alt="Food" />
                      </div>
                      <div class="tag__title">By Admin</div>
                    </li>
                    <li class="tag__item">
                      <div class="tag__icon">
                        <img src="img/icon/tag-3.svg" alt="Food" />
                      </div>
                      <div class="tag__title"><span>65</span> Comments</div>
                    </li>
                  </ul>
                </div>
              </article>
            </div>
            <aside class="page__aside"></aside>
          </div>
        </div>
      </main>
      <footer class="footer">
        <div class="footer__container">
          <ul class="footer__menu">
            <li class="footer__link">
              <a href="https://github.com/agb220" target="_blank">GitHub</a>
            </li>
          </ul>
          <p class="footer__copyright">
            Copyright © 2025 Anna Balabon. All Rights Reserved
          </p>
        </div>
      </footer>
    </div>
  </body>
</html>
